<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-[url('images/image.png')] bg-center bg-cover">
    <div class="container px-4 pt-5 m-auto min-h-screen relative">

                <li class="list-none"><a href="#" class="no-underline text-white px-2">Home</a></li>
